name: Deploy Frontend to Vercel

# Production deploy: only after CI passes on `master`, ship to Vercel from
# here (Vercel's git integration doesn't deploy master — see vercel.json).
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes

      # Tells the ADMIN_MASTER (app and e-mail) through the API; skipped
      # when API_URL/CRON_SECRET are not set in this repository.
      - name: Alert the administrators
        if: failure()
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then exit 0; fi
          jq -n --arg workflow "$GITHUB_WORKFLOW" --arg job "$GITHUB_JOB" \
            --arg runUrl "$RUN_URL" --arg branch "$GITHUB_REF_NAME" \
            '{workflow: $workflow, job: $job, runUrl: $runUrl, branch: $branch}' |
            curl --silent --show-error --max-time 30 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" --data @- \
              "$API_URL/internal/alerts/routine-failed" || true
